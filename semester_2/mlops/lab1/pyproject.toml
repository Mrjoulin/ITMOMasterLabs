[project]
name = "polymarket-pipeline"
version = "0.1.0"
description = "Ultra-fast Polymarket data pipeline with 5-minute BTC trading intervals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apache-airflow[postgres]>=2.9.0",
    "asyncpg>=0.30.0",
    "httpx[http2]>=0.27.0",
    "pydantic>=2.5.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.20.0",
    "aiocache>=0.12.2",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "clickhouse-driver>=0.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "sqlalchemy2-stubs>=0.0.2a38",
]

[project.urls]
Homepage = "https://github.com/your-org/polymarket-pipeline"
Repository = "https://github.com/your-org/polymarket-pipeline"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "T",  # flake8-print
    "PT", # flake8-pytest-style
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true