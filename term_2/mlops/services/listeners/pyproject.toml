[project]
name = "polymarket-listners"
version = "0.1.0"
description = "BTC Crypto listners"
requires-python = ">=3.11"
dependencies = [
    "redis>=7.4.0",
    "websockets>=16.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "prometheus_client>=0.20.0"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "T",  # flake8-print
    "PT", # flake8-pytest-style
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

[tool.setuptools]
py-modules = []
