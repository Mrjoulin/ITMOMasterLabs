[project]
name = "polymarket-prefect-flows"
version = "0.1.0"
description = "Prefect flows"
requires-python = ">=3.11"
dependencies = [
    "redis>=7.4.0",
    "psycopg2-binary>=2.9.9",
    "structlog>=24.1.0",
    "prefect>=3.6.0",
    "websockets>=16.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    # Pinned, and MUST match MLFLOW_VERSION in .env. This container receives
    # MLFLOW_BACKEND_STORE_URI, so its mlflow client can migrate the tracking DB schema
    # directly - a floating range here silently pushes the DB ahead of the server on the
    # next rebuild, which is what broke MLflow on 2026-08-24.
    "mlflow==3.15.1",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0.0",
    "sqlalchemy>=2.0.0",
    "optuna>=4.8.0",
    "cryptography>=43.0.0,<47",
    "boto3>=1.43.0",
    "py-clob-client-v2>=1.1.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
# Mirrors runtime import roots: Prefect puts the entrypoint's directory on sys.path,
# so flows/src is the root for `utils`/`clients` and flows/model for `src.*`.
pythonpath = ["src", "model"]
testpaths = ["tests", "model/tests"]
markers = [
    "unit: fast, isolated, no external services",
    "integration: requires Postgres/Redis/network",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "T",  # flake8-print
    "PT", # flake8-pytest-style
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

[tool.setuptools]
py-modules = []
