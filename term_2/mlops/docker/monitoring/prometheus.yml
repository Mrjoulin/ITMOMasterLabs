global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: docker
    static_configs:
      - targets: ["docker-exporter:9323"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
    # TimescaleDB splits every hypertable into hourly chunks, and postgres-exporter
    # emits ~28 per-table series for each one. Measured 2026-08-22: 159,964 of 165,783
    # active series (96%) were chunk-level metrics from _timescaledb_internal, costing
    # ~1.1 GB/day of TSDB. Per-chunk stats are noise - the parent hypertable totals are
    # what you actually monitor - so drop them at ingest.
    metric_relabel_configs:
      - source_labels: [schemaname]
        regex: _timescaledb_internal
        action: drop

  - job_name: listeners
    metrics_path: /metrics
    static_configs:
      - targets: ["polymarket-listeners:8000"]
