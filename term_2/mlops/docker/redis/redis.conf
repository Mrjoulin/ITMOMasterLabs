# 1. Memory Management (keep as is)
maxmemory 2gb
maxmemory-policy allkeys-lru

# 2. Persistence
# Enable RDB snapshots (every 5 min)
save 300 1

# Disable AOF completely
appendonly no

# RDB behavior
# Stop writing RDB if the latest save failed (avoid stale snapshots)
stop-writes-on-bgsave-error yes
# Use LZF compression for RDB files (saves disk space, minor CPU cost)
rdbcompression yes
# Enable checksum for integrity verification (adds ~10% overhead on save)
rdbchecksum yes

# 4. Reliability & Connection Management (keep as is)
rename-command FLUSHALL ""
rename-command FLUSHDB ""
tcp-keepalive 60
timeout 300