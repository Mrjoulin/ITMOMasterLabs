listen_addresses = '*'
port = 5432
max_connections = 200
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 26214kB
min_wal_size = 1GB
max_wal_size = 8GB
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# Time-series optimizations
shared_preload_libraries = 'timescaledb'
timescaledb.max_background_workers = 16
timescaledb.max_workers = 8
timescaledb.limit_chunks_cache_size = 100

# Logging
log_statement = 'ddl'
log_duration = on
log_lock_waits = on
log_temp_files = 0
log_checkpoints = on
log_connections = on
log_disconnections = on
log_timezone = 'UTC'

# Performance logging
log_min_duration_statement = 1000
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# JIT and optimization
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# Autovacuum tuning for high-frequency inserts
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 1000
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 1000
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 10ms

# Write-ahead logging optimization for frequent commits
synchronous_commit = off
commit_delay = 10
commit_siblings = 5
wal_compression = on
wal_writer_delay = 200ms
wal_writer_flush_after = 2MB